# .github/workflows/pr-bot.yml
# Comandos (comentados no PR):
#   bot codereview  -> Claude revisa o PR e comenta (inline + resumo)
#   bot approve     -> o bot aprova o PR
name: PR Bot

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write

jobs:
  bot:
    # Só em PRs, só comandos "bot ...", e só quando VOCÊ comenta (troque SEU_USUARIO)
    if: >
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'SEU_USUARIO' &&
      (startsWith(github.event.comment.body, 'bot codereview') ||
       startsWith(github.event.comment.body, 'bot approve'))
    runs-on: ubuntu-latest
    steps:
      - name: Gerar token do GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Reagir ao comando (👀)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api -X POST \
            repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content=eyes

      # ---------------- bot approve ----------------
      - name: Aprovar PR
        if: startsWith(github.event.comment.body, 'bot approve')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr review ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --approve \
            --body "Aprovado via \`bot approve\` ✅"

      # ---------------- bot codereview ----------------
      - name: Checkout do código do PR
        if: startsWith(github.event.comment.body, 'bot codereview')
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - name: Code review com Claude
        if: startsWith(github.event.comment.body, 'bot codereview')
        uses: anthropics/claude-code-action@v1
        with:
          # Opção A: chave da API (console.anthropic.com)
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Opção B: sua assinatura Pro/Max (gere com `claude setup-token`) — use no lugar da linha acima
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            Você é um revisor de código sênior. Revise este pull request.
            Use `gh pr view` e `gh pr diff` para entender a mudança e leia os arquivos
            do repositório quando precisar de contexto.

            Foque em: bugs e erros de lógica, segurança, concorrência/threading,
            vazamento de memória/ciclos de referência, performance, testes faltando
            e aderência à arquitetura que o projeto já usa.
            Não comente estilo que um linter pegaria.

            - Problemas em linhas específicas: use mcp__github_inline_comment__create_inline_comment.
            - No final, publique UM comentário de resumo com `gh pr comment`, contendo:
              veredito (✅ pode aprovar / ⚠️ ajustes sugeridos / ❌ bloqueante),
              lista dos achados por severidade e o que está bom.
            Responda em português do Brasil.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
